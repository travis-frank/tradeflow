services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tradeflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  datadog:
    image: gcr.io/datadoghq/agent:latest
    container_name: tradeflow-datadog
    environment:
      DD_API_KEY: ${DATADOG_API_KEY}
      DD_SITE: us5.datadoghq.com
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - "8126:8126"
      - "8125:8125/udp"

  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.api
      args:
        INSTALL_DEV: "true"
    container_name: tradeflow-api
    env_file: .env
    environment:
      DD_AGENT_HOST: datadog
      DD_SERVICE: tradeflow-api
      DD_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.api
    container_name: tradeflow-worker
    env_file: .env
    environment:
      DD_AGENT_HOST: datadog
      DD_SERVICE: tradeflow-worker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.api
    container_name: tradeflow-beat
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: tradeflow-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

  #mcp:
  #  build:
  #    context: ./backend
  #    dockerfile: ../infra/docker/Dockerfile.api
  #  container_name: tradeflow-mcp
  #  env_file: .env
  #  ports:
  #    - "8001:8001"
  #  depends_on:
  #    timescaledb:
  #      condition: service_healthy
  #    redis:
  #      condition: service_healthy
  #  volumes:
  #    - ./backend:/app
  #  command: python mcp/server.py

volumes:
  timescaledb_data:
  redis_data: